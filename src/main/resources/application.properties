# https://docs.spring.io/spring-boot/appendix/application-properties/index.html

server.port=8080

server.servlet.context-path=/ajufood/pedeai

spring.application.name=PedeAI



spring.datasource.url=jdbc:h2:mem:dbPedeAi

spring.datasource.driverClassName=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


spring.h2.console.enabled=true

# Define o caminho de acesso ao console do H2
spring.h2.console.path=/h2


spring.h2.console.settings.web-allow-others=true


spring.jpa.properties.hibernate.show_sql=true

# Formata os comandos SQL para facilitar a leitura no log
spring.jpa.properties.hibernate.format_sql=true


